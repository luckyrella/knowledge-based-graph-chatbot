{% extends "base.html" %}

{% block content %}
<section class="auth-section" style="padding-top: 150px; min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="card glass" style="width: 100%; max-width: 400px;">
        <h2 class="card-title" style="margin-bottom: 20px; text-align: center;">Login</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}" style="padding: 10px; margin-bottom: 15px; border-radius: 8px; background: rgba(79, 195, 247, 0.1); border: 1px solid var(--secondary-color); color: var(--secondary-color);">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth_bp.login') }}">
            <div class="form-group" style="margin-bottom: 15px;">
                <label for="username" style="display: block; margin-bottom: 5px; color: var(--text-muted);">Username or Email</label>
                <input type="text" id="username" name="username" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.05); color: var(--text-main);">
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label for="password" style="display: block; margin-bottom: 5px; color: var(--text-muted);">Password</label>
                <input type="password" id="password" name="password" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.05); color: var(--text-main);">
            </div>
            <button type="submit" class="btn btn-accent" style="width: 100%;">Login</button>
        </form>
        <p style="text-align: center; margin-top: 15px; color: var(--text-muted);">
            Don't have an account? <a href="{{ url_for('auth_bp.register') }}" style="color: var(--secondary-color);">Register here</a>
        </p>
    </div>
</section>
{% endblock %}
